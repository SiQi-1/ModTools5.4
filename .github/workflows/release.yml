name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install PyQt6 Pillow PyInstaller

      - name: Build exe and zip
        run: powershell -ExecutionPolicy Bypass -File build_release.ps1

      - name: Rename zip with version
        shell: pwsh
        run: Rename-Item ModTools5.4.zip "ModTools5.4_${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ModTools5.4_${{ github.ref_name }}.zip
          generate_release_notes: true
