name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compile all sources)
        run: python -m compileall -q ModTools_5_4 ModTools5.4.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
